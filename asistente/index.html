*{box-sizing:border-box;}
html,body{height:100%;}

header.top{background:var(--navy);

.top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;}

.chat{max-width:760px;margin:0 auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:10px;}

.bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;}

.msg.user{align-self:flex-end;}
.msg.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:4px;}
.bubble p{margin:0 0 6px;}
.bubble p:last-child{margin-bottom:0;}
.bubble b{color:var(--navy);}

.actions{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.actions a{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:13.5px;font-weight:600;
  padding:9px 12px;border-radius:10px;}
.actions a.main{background:var(--violet);color:#fff;}
.actions a.main:hover{background:#6D28D9;}
.actions a.sec{background:#F1EBFF;color:var(--violet);}
.actions a.sec:hover{background:#E6DBFF;}

.typing .bubble{display:flex;gap:4px;padding:13px 14px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--violet-soft);animation:blink 1s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

.chips-wrap{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--line);}
.chips{max-width:760px;margin:0 auto;padding:10px 14px 4px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--violet-soft);color:var(--violet);
  border-radius:999px;padding:7px 13px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap;}
.chip:hover{background:#F1EBFF;}

form.input{max-width:760px;margin:0 auto;padding:8px 14px 12px;display:flex;gap:8px;}
form.input input{flex:1;min-width:0;padding:12px 14px;font-size:15px;border:1px solid var(--line);

form.input input:focus{outline:none;border-color:var(--violet-soft);}
form.input button{flex:0 0 46px;height:46px;border:0;border-radius:50%;background:var(--grad);

form.input button svg{width:20px;height:20px;fill:#fff;}
.foot{max-width:760px;margin:0 auto;padding:0 14px 12px;font-size:10.5px;color:var(--text-soft);text-align:center;line-height:1.4;}
.foot a{color:var(--violet);}
body.embed header.top{display:none;}
body.embed .foot{display:none;}

    L['rev_'+ap.id] = {t:'📖 Leer la review de '+ap.n, u:ap.r};
    var acc = ['rev_'+ap.id];
    if(ap.p){ L['try_'+ap.id] = {t:ap.e+' Probar '+ap.n, u:ap.p}; acc.push('try_'+ap.id); }
    acc.push('todas');
    TEMAS.push({id:'app-'+ap.id, k:ap.k, app:true,
      r:[ap.e+' Para eso te recomiendo <b>'+ap.n+'</b>: '+ap.d+'.',
         'En la review te contamos cómo funciona, cuánto sale y si vale la pena para una pyme.'],
      a:acc});
  });

  var CHIPS = [
    {t:'💸 Calcular un sueldo', id:'sueldo'},
    {t:'🧾 Monotributo', id:'monotributo'},
    {t:'⚖️ Despido', id:'despido'},
    {t:'🗓️ Vencimientos', id:'vencimientos'},
    {t:'🎁 Aguinaldo', id:'aguinaldo'},
    {t:'📊 Costos de mi negocio', id:'costos'},
    {t:'🗂️ Convertir archivos', id:'conversor'},
    {t:'🤖 Apps con IA', id:'ia'},
    {t:'✉️ Hablar con alguien', id:'contacto'}
  ];

  var chat = document.getElementById('chat'), scroll = document.getElementById('scroll');
  var chipsEl = document.getElementById('chips'), form = document.getElementById('form'), txt = document.getElementById('txt');

  function norm(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[¿?¡!.,;:()"]/g,' ').replace(/\s+/g,' ').trim();
  }
  function esc(s){ return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function down(){ scroll.scrollTop = scroll.scrollHeight; }
  function contar(path){
    try{ if(window.goatcounter && window.goatcounter.count){
      window.goatcounter.count({path:'asistente/'+path, title:'asistente', event:true}); } }catch(e){}
  }

  function addUser(text){
    var d=document.createElement('div'); d.className='msg user';
    d.innerHTML='<div class="bubble">'+esc(text)+'</div>';
    chat.appendChild(d); down();
  }
  function addBot(parrafos, acciones){
    var d=document.createElement('div'); d.className='msg bot';
    var html='<img src="../assets/logo-rindex.png" alt=""><div class="bubble">'
      + parrafos.map(function(p){return '<p>'+p+'</p>';}).join('');
    if(acciones && acciones.length){
      html+='<div class="actions">'+acciones.map(function(key,i){
        var l=L[key]; var ext = l.u.indexOf('rindexia.com')===-1 || l.u.indexOf('herramientas.')!==-1;
        return '<a class="'+(i===0?'main':'sec')+'" href="'+l.u+'"'+(ext?' target="_blank" rel="noopener"':'')
          +' data-k="'+key+'">'+l.t+'</a>';
      }).join('')+'</div>';
    }
    d.innerHTML=html+'</div>';
    chat.appendChild(d); down();
  }
  function typing(cb){
    var d=document.createElement('div'); d.className='msg bot typing';
    d.innerHTML='<img src="../assets/logo-rindex.png" alt=""><div class="bubble"><span></span><span></span><span></span></div>';
    chat.appendChild(d); down();
    setTimeout(function(){ d.remove(); cb(); }, 550);
  }

  function buscar(text){
    var n=' '+norm(text)+' ', mejor=null, puntos=0;
    TEMAS.forEach(function(t){
      var p=0;
      t.k.forEach(function(k){
        var kk=norm(k);
        if(n.indexOf(' '+kk+' ')!==-1) p += kk.split(' ').length>1 ? 3 : 2;
        else if(kk.length>=5 && n.indexOf(kk)!==-1) p += 1;
      });
      /* los saludos y agradecimientos solo ganan si no hay otro tema */
      if(t.menu && p>0) p = 0.5;
      /* el tema general de apps pierde contra una app puntual */
      if(t.id==='ia') p = p*0.6;
      if(p>puntos){ puntos=p; mejor=t; }
    });
    return mejor;
  }

  function responder(tema){
    typing(function(){
      if(!tema){
        addBot(['Mmm, no estoy seguro de haberte entendido 🤔',
                'Probá con otras palabras (por ejemplo "monotributo", "despido" o "sueldo de comercio") o elegí una opción de abajo. Si es algo más puntual, escribinos.'],
               ['todas','contacto']);
        contar('sin-respuesta');
        return;
      }
      addBot(tema.r, tema.a);
      contar(tema.id);
    });
  }

  function enviar(text){
    text=(text||'').trim(); if(!text) return;
    addUser(text); txt.value='';
    responder(buscar(text));
  }

  CHIPS.forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=c.t;
    b.addEventListener('click',function(){
      addUser(c.t);
      responder(TEMAS.filter(function(t){return t.id===c.id;})[0]);
    });
    chipsEl.appendChild(b);
  });
  form.addEventListener('submit',function(e){ e.preventDefault(); enviar(txt.value); });
  chat.addEventListener('click',function(e){
    var a=e.target.closest('a[data-k]'); if(a) contar('click/'+a.getAttribute('data-k'));
  });

  /* Modo embebido (?embed=1): sin cabecera, para mostrarlo dentro del blog más adelante */
  try{ if(new URLSearchParams(location.search).get('embed')==='1') document.body.classList.add('embed'); }catch(e){}

  /* Bienvenida */
  addBot(['¡Hola! 👋 Soy el asistente de <b>Rindex</b>.',
          'Te ayudo a encontrar la herramienta gratis justa para tu sueldo, tu monotributo o tu negocio. Escribí tu consulta o elegí una opción de abajo 👇']);

  /* Si llega con ?q=consulta (desde el blog o redes), la responde directo */
  try{
    var q=new URLSearchParams(location.search).get('q');
    if(q) setTimeout(function(){ enviar(q.slice(0,300)); }, 400);
  }catch(e){}
})();
</script>
<script data-goatcounter="https://rindex.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
